name: Instagram analytics report

on:
  schedule:
    - cron: "0 0 * * 1" # 毎週月曜 9:00 JST
  workflow_dispatch:
    inputs:
      list_brands:
        description: "blogId確認モードで実行する(レポートは生成しない)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: instagram-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Check secrets
        id: check
        env:
          METRICOOL_API_TOKEN: ${{ secrets.METRICOOL_API_TOKEN }}
        run: |
          if [ -z "$METRICOOL_API_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "## ⚠️ Metricool APIが未設定です" >> "$GITHUB_STEP_SUMMARY"
            echo "docs/setup-instagram-analytics.md の手順でSecretsを登録してください。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: List brands (blogId確認)
        if: steps.check.outputs.configured == 'true' && inputs.list_brands
        env:
          METRICOOL_API_TOKEN: ${{ secrets.METRICOOL_API_TOKEN }}
          METRICOOL_USER_ID: ${{ secrets.METRICOOL_USER_ID }}
        run: python scripts/instagram_report.py --list-brands

      - name: Generate report
        if: steps.check.outputs.configured == 'true' && !inputs.list_brands
        env:
          METRICOOL_API_TOKEN: ${{ secrets.METRICOOL_API_TOKEN }}
          METRICOOL_USER_ID: ${{ secrets.METRICOOL_USER_ID }}
          METRICOOL_BLOG_ID: ${{ secrets.METRICOOL_BLOG_ID }}
          # 任意の上書き(未設定なら空文字→コード側でデフォルトにフォールバック)
          METRICOOL_FOLLOWERS_METRIC: ${{ secrets.METRICOOL_FOLLOWERS_METRIC }}
          METRICOOL_TIMEZONE: ${{ secrets.METRICOOL_TIMEZONE }}
        run: python scripts/instagram_report.py

      - name: Commit report
        if: steps.check.outputs.configured == 'true' && !inputs.list_brands
        run: |
          if [ -n "$(git status --porcelain data/reports)" ]; then
            git config user.name "casselini-x-bot"
            git config user.email "actions@github.com"
            git add data/reports
            git commit -m "Add Instagram analytics report"
            git push
          fi
